function rules(){const R=[],t=today(),S=[...D.cash].sort((a,b)=>a.day<b.day?-1:1);

 S.forEach((c,i)=>{const e=expCash(c),df=+c.actual_closing-e,ad=Math.abs(df);
  if(ad>=Math.max(1000,e*.005))add('cash:'+c.day,'cash',ad>=100000||ad>=e*.05?'critical':ad>=20000?'attention':'monitor',df<0?'Cash discrepancy':'Cash surplus',`Expected ${fmt(e)}, actual ${fmt(c.actual_closing)}. Difference ${fmt(df)} on ${c.day}.`,ad,'Cash close '+c.day,'Review '+(c.day==t?"today's":c.day)+' transactions, refunds and expenses.');
  const P=S.slice(0,i);if(P.length>=3){const av=k=>P.reduce((a,x)=>a+ +x[k],0)/P.length;
   if(+c.largest_txn>0&&+c.largest_txn>3*av('largest_txn'))add('txn:'+c.day,'txn','attention','Unusual transaction',`${fmt(c.largest_txn)} is significantly above this business's recent pattern (usual largest about ${fmt(av('largest_txn'))}). Review the transaction.`,+c.largest_txn,'Cash close '+c.day,'Review this transaction and who approved it.');
   if(c.refund_count>=3&&c.refund_count>2*av('refund_count'))add('refund:'+c.day,'refund','attention','Unusually high refunds',`${c.refund_count} refunds on ${c.day}, against about ${av('refund_count').toFixed(1)} on a usual day.`,+c.refunds||null,'Cash close '+c.day,'Review the refund records and reasons.');

  add('stock:'+sc.id,'stock',df<0?(im>=200000?'critical':'attention'):'monitor',df<0?'Stock discrepancy':'Stock surplus',`${p.name}: expected ${+sc.expected}, counted ${+sc.counted}. ${n} unit${n>1?'s':''} ${df<0?'unaccounted for':'more than expected'}.`,im,'Stock count '+String(sc.created_at).slice(0,10),'Review stock movements, sales, returns and adjustments.')});

 ${B.is_demo?'<button class="g neg" onclick="delDemo()">Delete this demo business</button>':'<button class="g" onclick="demo()">Create a demo business to explore</button>'}<button class="g" onclick="sb.auth.signOut()">Sign out</button></div></div>
 <p class="m">LeakGuard reports discrepancies and unusual activity. It does not accuse anyone. Always investigate before drawing conclusions.</p>`}
async function markRead(){try{await ok(sb.from('notifications').update({is_read:true}).eq('business_id',B.id).eq('is_read',false));await loadData();render()}catch(e){}}

/* ---- brand sheet: splash, onboarding steps, header, dashboard ---- */
I.bell='<path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 21h4"/>';I.warn='<path d="M12 4 3 19.5h18z"/><path d="M12 10v4.5M12 17.2v.1"/>';
let OB={},obStep=1,sec='';
function splash(){shell(0);$('#app').innerHTML=`<div class="splash"><img src="icon-192.png" alt=""><h1>LeakGuard</h1><p>Know where your money is leaking.</p><div class="btns"><button class="go" onclick="authView('up')">Get Started</button><button class="ol" onclick="authView('in')">Log In</button></div><small>DETECT · ANALYZE · PROTECT · GROW</small></div>`}
function onboard(){shell(0);const st=obStep,hd=`<div class="r"><b>Business onboarding</b><span class="m">${st}/3</span></div><div class="prog"><i style="width:${st/3*100}%"></i></div>`;
 const body=st==1?`<h1>Tell us about your business</h1>${fld('o1','Business name',OB.name)}${sel('o2','Business type',TYPES,OB.type)}<button class="a" onclick="obNext()">Next</button>`
 :st==2?`<h1>Where and how big?</h1>${fld('o3','Location',OB.loc)}${fld('o4','Number of employees',OB.emp,'number')}<button class="a" onclick="obNext()">Next</button><button class="g" onclick="obBack()">Back</button>`
 :`<h1>How does money move?</h1>${sel('o5','Do you hold inventory?',YN,OB.inv)}${sel('o6','Do you sell on credit?',YN,OB.cr)}${sel('o7','Do you handle cash?',YN,OB.cash)}<button class="a" onclick="saveOb()">Start LeakGuard</button><button class="g" onclick="obBack()">Back</button><button class="g" style="border-color:transparent" onclick="demo()">Or explore with demo data</button>`;
 $('#app').innerHTML=`<div class="c" style="margin-top:20px">${hd}${body}</div>`}
function obRead(){if(obStep==1){OB.name=v('o1').trim();OB.type=v('o2')}else if(obStep==2){OB.loc=v('o3').trim();OB.emp=v('o4')}else{OB.inv=v('o5');OB.cr=v('o6');OB.cash=v('o7')}}
function obNext(){obRead();if(obStep==1&&!OB.name)return toast('Enter your business name.');obStep++;onboard()}
function obBack(){obRead();obStep--;onboard()}
async function saveOb(){obRead();if(!OB.name)return toast('Enter your business name.');
 try{const id=await ok(sb.rpc('create_business',{p_name:OB.name,p_type:OB.type||'Other',p_location:OB.loc||'',p_employees:Math.round(parseFloat(OB.emp)||0),p_inv:OB.inv!='No',p_credit:OB.cr!='No',p_cash:OB.cash!='No'}));LS.s('lg_biz',id);OB={};obStep=1;await boot()}catch(e){}}
function who(){const n=String(U&&U.email||'').split('@')[0].split(/[._\-0-9]+/)[0]||'there';return n.charAt(0).toUpperCase()+n.slice(1)}
function render(){const T=[['home','Home','home',1],['cash','Cash','cash',B.uses_cash],['stock','Stock','box',B.has_inventory],['owed','Owed','owed',B.has_credit],['find','Findings','flag',1],['more','More','more',1]].filter(t=>t[3]);
 if(!T.some(t=>t[0]==tab))tab='home';shell(1);
 const body={home:homeV,cash:cashV,stock:stockV,owed:owedV,find:findV,more:moreV}[tab](),un=D.nt.filter(x=>!x.is_read).length,bad=D.fnd.filter(f=>isOpen(f)&&f.severity!='monitor').length,ini=(who()[0]||'U').toUpperCase();
 const S=[['home','Dashboard','home',tab=='home'],['cash','Cash','cash',tab=='cash',B.uses_cash],['stock','Stock','box',tab=='stock',B.has_inventory],['owed','Receivables','owed',tab=='owed',B.has_credit],['find','Findings','flag',tab=='find'&&ff!='investigating'],['inv','Investigations','owed',tab=='find'&&ff=='investigating'],['rep','Reports','cash',tab=='more'&&sec!='settings'],['set','Settings','more',tab=='more'&&sec=='settings']].filter(x=>x[4]===undefined||x[4]);
 const bell=`<button class="bell" aria-label="Alerts" onclick="go('more')">${ic('bell',18)}${un?`<em>${un}</em>`:''}</button>`;
 $('#app').innerHTML=`<aside class="sb"><div class="brand"><img src="icon-192.png" alt="" width="34" height="34"><b>LeakGuard</b></div>${S.map(([k,n,i,on])=>`<button class="si ${on?'on':''}" onclick="nav('${k}')">${ic(i,20)}<span>${n}</span>${k=='find'&&bad?`<span class="bdg">${bad}</span>`:''}</button>`).join('')}<div class="sbf"><div>${esc(B.name)}</div><div class="m2">${esc(U.email)}</div><button class="si" onclick="sb.auth.signOut()">Sign out</button></div></aside><main id="main"><div class="mtop"><img src="icon-192.png" alt="" width="30" height="30" style="border-radius:8px"><b>LeakGuard</b><span class="sp">${bell}</span></div><div class="tbar">${BZ.length>1?`<select aria-label="Business" onchange="LS.s('lg_biz',this.value);boot()">${BZ.map(b=>`<option value="${b.id}" ${b.id==B.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select>`:`<span class="m">${esc(B.name)}</span>`}${bell}<span class="av">${esc(ini)}</span></div>${B.is_demo?'<div class="demo">DEMO DATA. This is a sample business, not your real data.</div>':''}${body}</main><nav class="bn">${T.map(([k,n,i])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${ic(i)}<span>${n}</span></button>`).join('')}</nav>`;
 try{document.querySelectorAll('[onclick]:not(button):not(a)').forEach(e=>{e.tabIndex=0})}catch(e){}
 if(tab=='more'&&sec=='settings'){const el=document.getElementById('settings');if(el)el.scrollIntoView()}}
function nav(k){sec='';if(k=='inv'){ff='investigating';tab='find'}else if(k=='find'){if(ff=='investigating')ff='open';tab='find'}else if(k=='rep'){tab='more'}else if(k=='set'){tab='more';sec='settings'}else tab=k;render();if(!(tab=='more'&&sec=='settings'))scrollTo(0,0)}
function go(k){sec='';tab=k;render();scrollTo(0,0)}
function homeV(){const F=D.fnd.filter(isOpen),n=s=>F.filter(f=>f.severity==s).length,tot=F.reduce((a,f)=>a+ +(f.impact||0),0),lc=D.cash[0],lcd=lc?+lc.actual_closing-expCash(lc):0,top=sortF(F),h=new Date().getHours(),g=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
 const OD=D.rec.filter(r=>remn(r)>0&&daysPast(r.due_on)>0),od=OD.reduce((a,r)=>a+remn(r),0),cu=new Set(OD.map(r=>r.customer)).size;
 const SF=F.filter(f=>f.type=='stock'),sv=SF.reduce((a,f)=>a+ +(f.impact||0),0),units=D.counts.filter(c=>+c.counted<+c.expected&&SF.some(f=>f.dedupe_key=='stock:'+c.id)).reduce((a,c)=>a+(+c.expected-+c.counted),0);
 const tile=(cls,i,t)=>`<div class="ct"><span class="it ${cls}">${ic(i,18)}</span>${t}</div>`;
 return `<div class="hd"><div><h1 style="margin-bottom:2px">${g}, ${esc(who())}</h1><div class="m">Here's what needs your attention today.</div></div></div>
 <div class="c kpi" style="margin-top:14px"><span class="ai">${ic('warn',22)}</span><div style="flex:1;min-width:180px"><div class="m">Potential money requiring review</div><div class="big">${fmt(tot)}</div></div><div class="cnts"><span class="cn c1"><i></i><b>${n('critical')}</b>Critical</span><span class="cn c2"><i></i><b>${n('attention')}</b>Attention</span><span class="cn c3"><i></i><b>${n('monitor')}</b>Monitor</span></div></div>
 <div class="dg">${B.uses_cash?`<div class="c" onclick="go('cash')">${tile('g','cash','Cash')}${lc?`<div class="kv"><span>Expected</span><b>${fmt(expCash(lc))}</b></div><div class="kv"><span>Actual</span><b>${fmt(lc.actual_closing)}</b></div><div class="kv"><span>Difference</span>${dfc(lcd)}</div>`:'<div class="m">No cash close recorded yet. Tap to record one.</div>'}</div>`:''}
 ${B.has_inventory?`<div class="c" onclick="go('stock')">${tile('o','box','Stock')}<div class="big" style="font-size:20px">${SF.length} discrepanc${SF.length==1?'y':'ies'}</div><div class="m">${units} unit${units==1?'':'s'} unaccounted for</div><div class="kv" style="margin-top:6px"><span>Potential value</span><b>${fmt(sv)}</b></div></div>`:''}
 ${B.has_credit?`<div class="c" onclick="go('owed')">${tile('b','owed','Receivables')}<div class="big" style="font-size:20px">${fmt(od)}</div><div class="m">overdue · ${cu} customer${cu==1?'':'s'}</div><span class="lnk">View details →</span></div>`:''}</div>
 ${chart()}
 <h2>Recent findings</h2>${top.length?`<div class="fg">${top.slice(0,6).map(fcard).join('')}</div><button class="g" style="width:auto;padding:8px 18px" onclick="go('find')">View all</button>`:empty('Nothing needs attention yet.',`Record today's cash close${B.has_inventory?', add products and count stock':''}${B.has_credit?' or add customer balances':''} and LeakGuard will check them for discrepancies.`)+(D.cash.length+D.prod.length+D.rec.length?'':'<button class="g" onclick="demo()">Load demo data to see it in action</button>')}`}
['doAuth','saveOb','saveCash','saveProd','saveMov','saveCount','saveRec','savePay','saveNote','demo','markRead'].forEach(n=>{window[n]=guard(window[n])});
addEventListener('keydown',e=>{const t=e.target;if((e.key=='Enter'||e.key==' ')&&t&&t.matches&&t.matches('[onclick]:not(button):not(a):not(input):not(select):not(textarea)')){e.preventDefault();t.click()}});
sb.auth.getSession().then(({data})=>{if(!data.session)splash()});
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
